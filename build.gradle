plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.example.greenlantern'
base { archivesName = 'greenlantern' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "glsolo" { source sourceSets.main } }
        }
        client { property 'forge.enabledGameTestNamespaces', 'glsolo' }
        server { property 'forge.enabledGameTestNamespaces', 'glsolo'; args '--nogui' }
    }
}

repositories {
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://modmaven.dev' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-common-api:15.20.0.106')
    compileOnly fg.deobf('mezz.jei:jei-1.20.1-forge-api:15.20.0.106')
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
        'Specification-Title': 'glsolo',
        'Specification-Vendor': 'glsolo',
        'Specification-Version': '1',
        'Implementation-Title': 'glsolo',
        'Implementation-Version': project.jar.archiveVersion,
        'Implementation-Vendor': 'glsolo'
    ])
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    exclude 'assets/**'
    exclude 'data/**'
}

// Solo compila el filtro (los demas .java del repositorio son del anillo)
sourceSets {
    main {
        java {
            srcDirs = [projectDir]
            include 'HideOthers.java'
            include 'GlJeiPlugin.java'
            include 'GlSolo.java'
        }
    }
}
