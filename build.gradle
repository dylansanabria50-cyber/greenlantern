plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.example.greenlantern'
base { archivesName = 'greenlantern' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "greenlantern" { source sourceSets.main } }
        }
        client { property 'forge.enabledGameTestNamespaces', 'greenlantern' }
        server { property 'forge.enabledGameTestNamespaces', 'greenlantern'; args '--nogui' }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
}

tasks.named('jar', Jar).configure {
    manifest.attributes([
        'Specification-Title': 'greenlantern',
        'Specification-Vendor': 'greenlantern',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.jar.archiveVersion,
        'Implementation-Vendor': 'greenlantern'
    ])
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }


// Compila los .java que estan sueltos en la raiz del repositorio (los recursos siguen en src/main/resources)
sourceSets {
    main {
        java {
            srcDirs = [projectDir]
            include '*.java'
            exclude 'CombatItem.java'
            exclude 'CombatScreen.java'
            exclude 'BoxModel.java'
            exclude 'GunRenderer.java'
            exclude 'RocketRenderer.java'
            exclude 'ShieldBlock.java'
            exclude 'ShieldFx.java'
            exclude 'ShieldRender.java'
            exclude 'SuitLight.java'
            exclude 'ConstructBlock.java'
            exclude 'HideOthers.java'
            exclude 'GlJeiPlugin.java'
        }
    }
}

// los modelos y texturas de jet, ametralladora y cohetes que estaban en recursos vienen de otro mod: no van en el .jar
processResources {
    exclude 'assets/greenlantern/jet.txt', 'assets/greenlantern/jet_png.b64', 'assets/greenlantern/gun.txt', 'assets/greenlantern/gun_barrel.txt', 'assets/greenlantern/gun_png.b64', 'assets/greenlantern/rocket.txt'
}
